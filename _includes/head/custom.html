<style>
/* Keep hamburger visible */
.greedy-nav .greedy-nav__toggle {
  display: block !important;
  visibility: visible !important;
  margin-left: 0 !important;
}
/* Keep search visible */
.greedy-nav .search__toggle {
  display: block !important;
}
/* Put dropdown on the right */
.greedy-nav .hidden-links {
  right: 0;
  left: auto;
}
/* Push the remaining visible item (Shop) to the right side */
.greedy-nav .visible-links {
  margin-left: auto;
}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  function forceHamburger() {
    const visible = document.querySelector(".visible-links");
    const hidden = document.querySelector(".hidden-links");
    const button = document.querySelector(".greedy-nav__toggle");
    if (!visible || !hidden || !button) return;

    // Move every nav item EXCEPT Shop into the hamburger dropdown
    Array.from(visible.children).forEach(item => {
      const link = item.querySelector("a");
      const href = link ? link.getAttribute("href") : "";
      const text = link ? link.textContent.trim().toLowerCase() : "";
      const isShop = href === "/shop/" || href === "/shop" || text === "shop";
      if (!isShop) {
        hidden.appendChild(item);
      }
    });

    button.classList.remove("hidden");
    button.style.display = "block";
  }
  forceHamburger();
  setTimeout(forceHamburger, 100);
  setTimeout(forceHamburger, 500);
  setTimeout(forceHamburger, 1000);
  window.addEventListener("resize", forceHamburger);
});
</script>
