<style>
/* Hide normal desktop navigation links */
.greedy-nav .visible-links {
  display: none !important;
}

/* Keep the nav layout normal */
.greedy-nav {
  position: relative;
}

/* Put hamburger at the far right */
.greedy-nav__toggle {
  display: block !important;
  float: right;
  margin-left: auto;
}

/* Put dropdown under the hamburger */
.greedy-nav .hidden-links {
  right: 0;
  left: auto;
}
</style>

<script>
window.addEventListener("load", function () {
  const button = document.querySelector(".greedy-nav__toggle");
  const hiddenLinks = document.querySelector(".hidden-links");

  if (!button || !hiddenLinks) return;

  button.classList.remove("hidden");
  button.style.display = "block";

  button.onclick = function (event) {
    event.preventDefault();
    event.stopPropagation();

    hiddenLinks.classList.toggle("hidden");
    button.classList.toggle("close");
  };
});
</script>
