<style>
/* Hide normal page links */
.greedy-nav .visible-links {
  display: none !important;
}

/* Force hamburger visible */
.greedy-nav .greedy-nav__toggle {
  display: block !important;
  visibility: visible !important;
}

/* Keep search icon beside hamburger */
.greedy-nav .search__toggle {
  display: block !important;
}

/* Put dropdown on the right */
.greedy-nav .hidden-links {
  right: 0 !important;
  left: auto !important;
}
</style>

<script>
window.addEventListener("load", function () {
  var button = document.querySelector(".greedy-nav__toggle");

  if (button) {
    button.classList.remove("hidden");
  }
});
</script>
