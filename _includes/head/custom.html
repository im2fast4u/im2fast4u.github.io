<style>
/* Hide all pages except Shop before JS runs */
.greedy-nav .visible-links > li {
  display: none !important;
}
.greedy-nav .visible-links > li:has(a[href="/shop/"]) {
  display: block !important;
}

/* Keep hamburger visible */
.greedy-nav .greedy-nav__toggle {
  display: block !important;
  visibility: visible !important;
  margin-left: 0 !important;
}
/* Keep search visible */
.greedy-nav .search__toggle {
  display: block !important;
}
/* Put dropdown on the right */
.greedy-nav .hidden-links {
  right: 0;
  left: auto;
}
/* Push Shop to the right side */
.greedy-nav .visible-links {
  margin-left: auto;
}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const visible = document.querySelector(".visible-links");
  const hidden = document.querySelector(".hidden-links");
  const button = document.querySelector(".greedy-nav__toggle");
  if (!visible || !hidden || !button) return;
  function isShop(item) {
    const link = item.querySelector("a");
    if (!link) return false;
    const href = link.getAttribute("href") || "";
    return href === "/shop/" || href === "/shop";
  }
  function sweep() {
    Array.from(visible.children).forEach(item => {
      if (!isShop(item)) {
        hidden.appendChild(item);
      }
    });
    Array.from(hidden.children).forEach(item => {
      if (isShop(item)) {
        visible.appendChild(item);
      }
    });
    button.classList.remove("hidden");
    button.style.display = "block";
  }
  sweep();
  
  let resizeTimeout;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(sweep, 100);
  });
  
  setInterval(sweep, 500);
});
</script>
